<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Your local Flower Shop in Kent, offering beautiful bouquets and floral arrangements for all occasions.">
        <meta name="keywords" content="flowers, bouquets, arrangements, local flower shop">
        <meta name="author" content="Vanesa Chervenyakova">
        <title> Flower Shop in Kent </title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
<header>
    
    <img src="https://plus.unsplash.com/premium_vector-1733827521260-3e1d058bedaa?q=80&w=710&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="rose logo" width="100px" height="100px">
    
    <nav>
        <a href="index.html"> Home</a>
        <a href="About.html"> About Us </a>
        <a href="OurWork.html"> Our Work </a>
        <a href="Contact.html"> Contact us </a>
    </nav>
</header>

<form action="Send.html" method="get">
    <fieldset>
        <legend> Your contact details </legend>
<div>
    <label for="name"> Your name: </label>
    <input id="name" type="text" placeholder="Your name" name="name">
</div>
<div>
   <label for="email"> Your email: </label>
   <input id="email" type="email" placeholder="Your email" name="email">
</div>
<div>
   <label for="phone"> Telephone number: </label>
   <input id="phone" type="text" placeholder="Telephone number" name="phone">
</div>
</fieldset>
<fieldset>
    <legend> Your enquiry details </legend>
<div>
    <label for="enquiry_type"> Type of enquiry: </label>
    <select name="enquiry_type" id="enquiry_type">
        
        <option value="bouquet"> Bouquet enquiry </option>
        <option value="consultation"> Consultation with a florist </option>
        <option value="other"> Other </option>
    </select>   
</div>  
<div>
   <label for="message"> Your message: </label>
   <br>
  <textarea id="message" name="message" rows="10" cols="70"> Type your message here... </textarea>
</div>
</fieldset> 
<input type="submit" value="Send">
    </form>
<footer>
    <div>
         <p> Address: 31 Castle Street, Canterbury, Kent, CT2 3PK</p>
         <P> Phone: 01227 123456 </P>
         <p> Email: info@flowershop.com </p>
    </div>
    <div>
        <p> Find us on social media:</p>
        <a href="https://www.facebook.com/" target="_blank"> Facebook </a>
        <a href="https://www.instagram.com/" target="_blank"> Instagram </a>
        <a href="https://www.twitter.com/" target="_blank"> Twitter </a>
    </div>
    </footer>
</body>
</html>
